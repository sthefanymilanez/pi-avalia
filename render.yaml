services:
  - type: web
    name: pi-avalia-teste
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pi-avalia-teste-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"

databases:
  - name: pi-avalia-teste-db
    databaseName: pi_avalia
    user: pi_avalia
    plan: free
    region: ohio
    postgresMajorVersion: "16"
    ipAllowList: []
